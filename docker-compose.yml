services:
  db:
    image: postgres:16-alpine
    container_name: worktime-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-worktime}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-worktime_secret}
      POSTGRES_DB: ${POSTGRES_DB:-worktime_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-worktime} -d $${POSTGRES_DB:-worktime_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: worktime-web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-worktime}:${POSTGRES_PASSWORD:-worktime_secret}@db:5432/${POSTGRES_DB:-worktime_db}?schema=public
    ports:
      - "${PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  postgres_data:
    name: worktime_postgres_data
